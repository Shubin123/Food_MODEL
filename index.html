<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- ONNX Runtime Web from CDN: runs the nutrition model entirely in-browser. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>🍎 Food Tracker</h1>
    <p class="subtitle">
      Identify food from a photo, then review the estimated portion before
      logging calories and macros. Results are estimates, not medical advice.
    </p>

    <section class="card">
      <h2>Analyze a photo</h2>

      <label for="imageUrl">Photo URL <span class="hint">(for testing)</span></label>
      <input id="imageUrl" type="url" placeholder="https://example.com/food.jpg" />

      <label for="fileInput">…or upload a file</label>
      <input id="fileInput" type="file" accept="image/*" />

      <label for="modelUrl">Model file (.onnx)</label>
      <input id="modelUrl" type="text" placeholder="model.onnx" value="model.onnx" />

      <label for="modelId">Model architecture</label>
      <select id="modelId"></select>

      <button id="analyzeBtn">Analyze</button>
      <div id="status" class="status"></div>
    </section>

    <section class="card hidden" id="resultCard">
      <h2>Result</h2>
      <img id="resultImg" class="hidden" alt="analyzed food" />
      <div id="resultBody"></div>
      <div id="portionEditor" class="portion-editor hidden">
        <label for="portionGrams">Portion (grams)</label>
        <input id="portionGrams" type="number" min="1" step="1" inputmode="decimal" />
        <p id="estimateNote" class="hint">Adjust the portion to recalculate this estimate.</p>
      </div>
      <button id="logBtn">Add to log</button>
    </section>

    <section class="card">
      <h2>Food log <span id="totalCalories" class="total">0 kcal</span></h2>
      <ul id="entries"></ul>
    </section>
  </main>

  <script src="nutrition.js"></script>
  <script src="models.js"></script>
  <script src="app.js"></script>
</body>
</html>
